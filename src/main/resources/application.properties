spring.application.name=weatheriq
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/weatheriq}
spring.data.mongodb.database=${MONGODB_DATABASE:weatheriq}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# SMTP
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:noreply@weatheriq.com}

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.verification.token-expiry-minutes=${VERIFICATION_TOKEN_EXPIRY_MINUTES:10}

# Open-Meteo
openmeteo.geocoding.url=${OPEN_METEO_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
openmeteo.weather.url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
openmeteo.airquality.url=${OPEN_METEO_AIR_QUALITY_URL:https://air-quality-api.open-meteo.com/v1/air-quality}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=15m

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Scheduling
app.scheduling.subscription-cron=${SCHEDULING_SUBSCRIPTION_CRON:0 0 * * * *}
app.scheduling.alert-cron=${SCHEDULING_ALERT_CRON:0 0 * * * *}
app.scheduling.timezone=${SCHEDULING_TIMEZONE:UTC}